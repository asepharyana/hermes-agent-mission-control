name: Probe SSH Key Secret v2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and inspect
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" | base64 -d > /tmp/k
          echo "key bytes: $(wc -c < /tmp/k)"
          echo "first line: $(head -1 /tmp/k)"
          echo "last line: $(tail -1 /tmp/k)"
          echo "--- xxd head ---"
          head -c 60 /tmp/k | xxd | head -3
          echo "--- ssh-keygen verbose ---"
          ssh-keygen -y -f /tmp/k; echo "keygen_exit=$?"
          echo "--- openssl check? ---"
          base64 --version | head -1